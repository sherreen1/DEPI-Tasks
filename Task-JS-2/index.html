<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Dollar To EGP</title>
  </head>
  <body>

    <div class="container mt-12 pt-12">
      <div class="row">
        <div class="col-10 mx-auto">
          <h2 class="text-center mt-10 mb-4">
            Convert Dollar To Egyptian Pound
          </h2>
          <form id="convertForm">
            <input
              id="doller"
              class="form-control my-8"
              id="doller"
              placeholder="Enter Dollar"
            />
            <input
              type="submit"
              value="Convert"
              class="btn-solid theme-success my-8 d-block w-100"
              id="convert"
            />
          </form>
          <h5 id="result" class="text-center mt-4"></h5>
        </div>
      </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
