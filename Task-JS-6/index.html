<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-do-list & BOM</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Task1 scrollly Navbar -->
    <nav class="navbar md:navbar-expand bg-danger">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Navbar</a>
        <button
          class="btn-icon navbar-toggler"
          type="button"
          data-bs-toggle="drawer"
          data-bs-target="#navbarDrawer"
          aria-controls="navbarDrawer"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog
          class="drawer drawer-end"
          tabindex="-1"
          id="navbarDrawer"
          aria-labelledby="navbarDrawerLabel"
        >
          <div class="drawer-header">
            <h5 class="drawer-title" id="navbarDrawerLabel">Menu</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="drawer"
              aria-label="Close"
            ></button>
          </div>
          <div class="drawer-body mb-2 md:mb-0">
            <ul class="nav navbar-nav me-auto">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Link</a>
              </li>
              <li class="nav-item">
                <button
                  class="nav-link"
                  type="button"
                  data-bs-toggle="menu"
                  aria-expanded="false"
                >
                  Menu
                </button>
                <div class="menu">
                  <a class="menu-item" href="#">Action</a>
                  <a class="menu-item" href="#">Another action</a>
                  <hr class="menu-divider" />
                  <a class="menu-item" href="#">Something else here</a>
                </div>
              </li>
              <li class="nav-item">
                <a class="nav-link disabled" aria-disabled="true">Disabled</a>
              </li>
            </ul>
            <form class="hstack gap-2" role="search">
              <input
                class="form-control"
                type="search"
                placeholder="Search"
                aria-label="Search"
              />
              <button class="btn-solid btn-icon theme-secondary" type="submit">
                <svg class="bi" width="16" height="16">
                  <use href="#search" />
                </svg>
              </button>
            </form>
          </div>
        </dialog>
      </div>
    </nav>

    <h2 id="demo" class="text-center my-10">Scroll down to see the effect</h2>
    <hr />
    <!--Task_2 To add delete button to each list item -->
    <div class="container">
      <div class="row">
        <div class="md:col-10 m-auto">
          <h2 class="text-center">To Do List</h2>
          <form id="myForm">
            <input
              type="text"
              name="works"
              id="works"
              placeholder="Enter your works"
              class="form-control my-5"
            />
            <input
              type="submit"
              value="Enter"
              class="btn-solid theme-accent form-control"
            />
          </form>
          <ul id="result"></ul>
        </div>
      </div>
    </div>

    <!-- <h1 id="Timer"></h1>
    <button onclick="mouse = setInterval(myTimer, 1000)">continue</button>
    <button onclick="mouse = setTimeout(setDate, 1000)">Start</button>
    <button onclick="clearInterval(mouse)">Stop</button> -->

    <!-- Task_3 setInterval && setTimeout -->

    <hr class="my-5" />

    <div class="pomodoro">
      <h2>Pomodoro Timer</h2>
      <p>Time to Focus</p>

      <div class="timer" id="timer">25:00</div>

      <p id="status">Ready to study?</p>

      <button onclick="startTimer()">Start</button>
      <button onclick="pauseTimer()">Pause</button>
      <button onclick="resetTimer()">Reset</button>
    </div>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
    <script src="js/main.js"></script>
  </body>
</html>
